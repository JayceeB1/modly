name: Artist Context experimental gate

on:
  push:
    branches:
      - integration/artist-intent-core-2026-10-10
      - integration/live-texture-2026-10-10
      - integration/artist-intent-propagation-2026-10-10
      - integration/modly-next-full-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert test source parses
        run: node --check src/areas/workflows/nodes/intent-travel/processor.test.mjs
      - name: Artist Context unit tests
        run: node --test src/areas/workflows/nodes/intent-travel/processor.test.mjs
      - name: Typed built-in processors
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.builtins.json
      - name: Full Node suite (staged integration)
        id: node_suite
        continue-on-error: true
        run: npm run test:node
      - name: Main-process typecheck (staged integration)
        id: main_types
        continue-on-error: true
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json
      - name: ESLint (staged integration)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Electron desktop bundle (not a packaged Windows app)
        id: build
        continue-on-error: true
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt
      - name: Python suite (staged integration)
        id: python_suite
        continue-on-error: true
        run: npm run test:py
      - name: Integrations gate
        if: steps.node_suite.outcome != 'success' || steps.main_types.outcome != 'success' || steps.lint.outcome != 'success' || steps.build.outcome != 'success' || steps.python_suite.outcome != 'success'
        run: |
          echo 'At least one integrated check failed; see the individual check logs.'
          exit 1

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Windows destructive-storage regression
        run: node --test --experimental-strip-types --experimental-loader ./scripts/node-ts-extensionless-loader.mjs electron/main/storage-directory-guard.test.ts
      - name: Windows artist-intent regression
        run: node --test src/areas/workflows/nodes/intent-travel/processor.test.mjs
      - name: Windows intent propagation safety tests
        run: node --experimental-strip-types --test src/areas/workflows/intentPropagation.test.mjs
      - name: Windows texture watcher, IPC and Three.js helper regressions
        run: node --test --experimental-strip-types --experimental-loader ./scripts/node-ts-extensionless-loader.mjs electron/main/texture-watch-service.test.ts electron/preload/texture-watch-preload.test.ts src/areas/generate/components/liveTexture.test.ts
      - name: Windows main-process typecheck
        run: npx --no-install tsc --noEmit -p tsconfig.node.json
      - name: Windows built-ins typecheck
        run: npx --no-install tsc --noEmit -p tsconfig.builtins.json
      - name: Build desktop bundle on Windows
        run: npm run build
